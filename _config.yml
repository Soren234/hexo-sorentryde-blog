# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Sorentryde.dk
subtitle: ''
description: ''
keywords:
author: Søren Tryde Andersen
language: en
timezone: ''

#Profile information
name: Søren Tryde Andersen
tagline: Tech Lead
avatar: images/profile.png
pic: profile.png  #place a 100x100 picture inside /assets/images/ folder and provide the name of the file below
summary: 'I’m passionate about building software that creates real value. Currently, I work as a software developer at a pension and insurance company, where I design and develop solutions using a wide range of technologies.

My technical stack includes C#, JavaScript, TypeScript, Java, and PowerShell, which I apply across both frontend and backend systems. I’m experienced with modern frameworks like Angular and React, and I follow object-oriented principles, design patterns, and clean code practices to ensure scalable and maintainable applications.

Beyond coding, I work extensively with infrastructure and cloud technologies, including Windows Server and Azure Cloud, to deploy and manage reliable, secure environments. One of my key responsibilities is building and maintaining the company’s DEX platform — an internal solution built on Microsoft 365 services like SharePoint and Teams — to drive collaboration and streamline business processes.

Driven by curiosity and a commitment to growth, I’m always exploring areas like CI/CD pipelines, software architecture, and emerging tools and frameworks to keep improving what I build.'

#sidebar links
email: sorentryde@gmail.com
website: sorentryde.dk #do not add http://
linkedin: søren-tryde-andersen
github: Soren234
gitlab: sorentryde

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://sorentryde.dk
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing index.html from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: "*admin/*"

# Writing
new_post_name: :year-:month-:day-:title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: '/blog'
  per_page: 5
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## Use post's date for updated date unless set in front-matter
updated_option: date

# Pagination
## Set per_page to 0 to disable pagination
per_page: 5
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: sorentryde-blog-theme

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: https://github.com/Soren234/soren234.github.io
  # example, https://github.com/hexojs/hexojs.github.io
  branch: gh-pages


