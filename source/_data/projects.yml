- project:
  title: Gameserver indexing website
  link: "Csgo2play.net"
  time: "2016 - present"
  tagline: "When i still was studying computer science, i had an idea of building my own server indexing website, with jobs pinging servers within the game called Counter-Strike.
            The website has been in multiple iterations and currently is running Nodejs12 Angular8, Java8 with multiple cool java packages.
            The application is build and deployed via Azure Devops and currently runs on my home server on Tomcat instance with a reverse proxy in front."
